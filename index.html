<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Universal Player</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}

.app{max-width:1400px;margin:auto;padding:14px}

header{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin-bottom:12px
}
.logo{font-size:22px;font-weight:800}
.headerBtns{display:flex;gap:8px}

.btn{
 background:#181818;color:#fff;border:1px solid #333;
 border-radius:10px;padding:9px 13px
}
.btn:hover{background:#242424}

.player{
 position:relative;background:#000;border-radius:14px;
 overflow:hidden;width:100%;aspect-ratio:16/9;
 display:flex;align-items:center;justify-content:center
}

video{
 width:100%;height:100%;display:block;
 background:#000
}

.audioScreen{
 position:absolute;inset:0;display:none;
 align-items:center;justify-content:center;
 font-size:70px;background:#080808
}

.overlay{
 position:absolute;inset:0;pointer-events:none;
 display:flex;align-items:center;justify-content:center
}
.centerPlay{
 pointer-events:auto;width:70px;height:70px;border-radius:50%;
 border:0;background:#ffffffdd;color:#000;font-size:30px
}

.controls{
 background:#111;border:1px solid #252525;
 border-radius:12px;padding:10px;margin-top:10px
}

.progress{
 width:100%;height:6px;accent-color:#fff;
 cursor:pointer
}

.row{
 display:flex;align-items:center;gap:7px;
 flex-wrap:wrap;margin-top:9px
}

.controlBtn{
 background:#191919;color:#fff;border:1px solid #303030;
 border-radius:8px;padding:8px 10px;min-width:42px
}

.controlBtn:hover{background:#292929}

.time{font-size:13px;color:#bbb;min-width:100px}

input[type=range]{accent-color:#fff}
.range{width:120px}

.panel{
 margin-top:12px;background:#0d0d0d;
 border:1px solid #252525;border-radius:12px;padding:12px
}

.panel h3{margin:0 0 10px;font-size:15px}

.urlRow{display:flex;gap:8px}
.urlRow input{
 flex:1;min-width:0;background:#151515;color:#fff;
 border:1px solid #333;border-radius:9px;padding:11px
}

.fileDrop{
 border:1px dashed #444;border-radius:10px;
 padding:18px;text-align:center;color:#aaa;margin-top:10px
}

.settings{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:10px
}

.setting{
 background:#141414;border:1px solid #282828;
 border-radius:10px;padding:10px
}

.settingTop{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:8px
}
.settingTop b{font-size:13px}
.value{font-size:12px;color:#aaa}

.adjust{
 display:flex;align-items:center;gap:6px
}
.adjust button{
 width:34px;height:34px;background:#202020;color:#fff;
 border:1px solid #333;border-radius:7px
}
.adjust input{flex:1}

select{
 background:#171717;color:#fff;border:1px solid #333;
 border-radius:8px;padding:8px;width:100%
}

.queue{
 max-height:230px;overflow:auto
}
.item{
 padding:9px;border-bottom:1px solid #222;
 cursor:pointer;display:flex;justify-content:space-between;gap:8px
}
.item:hover{background:#181818}

.status{
 margin-top:10px;color:#aaa;font-size:13px;
 min-height:18px
}

.info{
 color:#888;font-size:12px;line-height:1.5;
 margin-top:8px;word-break:break-all
}

.hidden{display:none!important}

@media(max-width:600px){
 .app{padding:8px}
 .player{border-radius:9px}
 .controlBtn{padding:7px 8px}
 .range{width:90px}
 .logo{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">Universal Player</div>
 <div class="headerBtns">
  <button class="btn" id="openBtn">Open</button>
  <button class="btn" id="fullscreenBtn">⛶</button>
 </div>
</header>

<div class="player" id="playerWrap">
 <video id="video" playsinline preload="metadata"></video>
 <div class="audioScreen" id="audioScreen">🎵</div>

 <div class="overlay">
  <button class="centerPlay" id="centerPlay">▶</button>
 </div>
</div>

<div class="controls">
 <input id="progress" class="progress" type="range" min="0" max="1000" value="0">

 <div class="row">
  <button class="controlBtn" id="prevBtn">⏮</button>
  <button class="controlBtn" id="backBtn">−10</button>
  <button class="controlBtn" id="playBtn">▶</button>
  <button class="controlBtn" id="forwardBtn">+10</button>
  <button class="controlBtn" id="nextBtn">⏭</button>

  <span class="time" id="time">00:00 / 00:00</span>

  <button class="controlBtn" id="muteBtn">🔊</button>
  <input class="range" id="volume" type="range" min="0" max="100" value="100">

  <button class="controlBtn" id="pipBtn">PiP</button>
  <button class="controlBtn" id="stopBtn">■</button>
 </div>
</div>

<div class="panel">
 <h3>Direct Video URL</h3>

 <div class="urlRow">
  <input id="urlInput"
   placeholder="Paste MP4 / WebM / M3U8 video URL">
  <button class="btn" id="urlPlayBtn">Play</button>
 </div>

 <div class="fileDrop" id="drop">
  Drop video/audio file here
  <br>
  <button class="btn" id="fileBtn" style="margin-top:8px">Choose File</button>
  <input id="fileInput" type="file"
   accept="video/*,audio/*,.mkv,.avi,.mov,.wmv,.flv,.ts,.m4v,.webm,.mp4,.mp3,.wav,.aac,.flac,.ogg"
   multiple hidden>
 </div>

 <div class="status" id="status"></div>
</div>

<div class="panel">
 <h3>Playback</h3>

 <div class="settings">

  <div class="setting">
   <div class="settingTop">
    <b>Speed</b><span class="value" id="speedValue">1.00×</span>
   </div>
   <select id="speed">
    <option value="0.25">0.25×</option>
    <option value="0.50">0.50×</option>
    <option value="0.75">0.75×</option>
    <option value="1" selected>1.00×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.50×</option>
    <option value="1.75">1.75×</option>
    <option value="2">2.00×</option>
    <option value="2.5">2.50×</option>
    <option value="3">3.00×</option>
    <option value="4">4.00×</option>
   </select>
  </div>

  <div class="setting">
   <div class="settingTop">
    <b>Quality</b>
    <span class="value" id="qualityValue">Auto</span>
   </div>
   <select id="quality">
    <option value="-1">Auto</option>
   </select>
  </div>

  <div class="setting">
   <div class="settingTop">
    <b>Aspect Ratio</b>
   </div>
   <select id="aspect">
    <option value="contain">Best Fit</option>
    <option value="contain">Fit Screen</option>
    <option value="cover">Fill</option>
    <option value="stretch">Stretch</option>
    <option value="16:9">16:9</option>
    <option value="4:3">4:3</option>
    <option value="16:10">16:10</option>
    <option value="2:1">2:1</option>
    <option value="2.21:1">2.21:1</option>
    <option value="2.35:1">2.35:1</option>
    <option value="2.39:1">2.39:1</option>
    <option value="5:4">5:4</option>
    <option value="center">Center</option>
   </select>
  </div>

 </div>
</div>

<div class="panel">
 <h3>Video Settings</h3>

 <div class="settings">

  <div class="setting">
   <div class="settingTop">
    <b>Brightness</b><span class="value" id="brightnessValue">100%</span>
   </div>
   <div class="adjust">
    <button data-adjust="brightness" data-dir="-1">−</button>
    <input id="brightness" type="range" min="0" max="200" value="100">
    <button data-adjust="brightness" data-dir="1">+</button>
   </div>
  </div>

  <div class="setting">
   <div class="settingTop">
    <b>Contrast</b><span class="value" id="contrastValue">100%</span>
   </div>
   <div class="adjust">
    <button data-adjust="contrast" data-dir="-1">−</button>
    <input id="contrast" type="range" min="0" max="200" value="100">
    <button data-adjust="contrast" data-dir="1">+</button>
   </div>
  </div>

  <div class="setting">
   <div class="settingTop">
    <b>Saturation</b><span class="value" id="saturationValue">100%</span>
   </div>
   <div class="adjust">
    <button data-adjust="saturation" data-dir="-1">−</button>
    <input id="saturation" type="range" min="0" max="200" value="100">
    <button data-adjust="saturation" data-dir="1">+</button>
   </div>
  </div>

  <div class="setting">
   <div class="settingTop">
    <b>Volume</b><span class="value" id="volumeValue">100%</span>
   </div>
   <div class="adjust">
    <button data-adjust="volume" data-dir="-1">−</button>
    <input id="volume2" type="range" min="0" max="100" value="100">
    <button data-adjust="volume" data-dir="1">+</button>
   </div>
  </div>

 </div>
</div>

<div class="panel">
 <h3>Queue</h3>
 <div class="queue" id="queue"></div>
</div>

<div class="panel">
 <h3>Media Info</h3>
 <div class="info" id="info">No media loaded.</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
