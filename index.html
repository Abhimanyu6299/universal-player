<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>Universal Player</title>

  <!-- HLS quality/audio support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <style>
    :root{
      --bg:#050505;
      --panel:#101010;
      --panel2:#171717;
      --border:#292929;
      --text:#f4f4f4;
      --muted:#999;
      --accent:#1687ff;
      --danger:#ff4545;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      width:100%;
      max-width:1500px;
      margin:auto;
      padding:12px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    header h1{
      font-size:20px;
      margin:0;
    }

    .header-buttons{
      display:flex;
      gap:7px;
    }

    .btn{
      background:#171717;
      color:#fff;
      border:1px solid #333;
      border-radius:8px;
      padding:9px 12px;
    }

    .btn:hover{
      background:#222;
    }

    .player-wrap{
      width:100%;
      aspect-ratio:16/9;
      min-height:220px;
      background:#000;
      border:1px solid #262626;
      border-radius:10px;
      overflow:hidden;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .player-wrap:fullscreen{
      width:100vw;
      height:100vh;
      aspect-ratio:auto;
      border:0;
      border-radius:0;
      background:#000;
    }

    video{
      width:100%;
      height:100%;
      background:#000;
      display:block;
      object-fit:contain;
      transform-origin:center center;
    }

    #ytBox{
      width:100%;
      height:100%;
      display:none;
      background:#000;
    }

    #ytPlayer{
      width:100%;
      height:100%;
    }

    .subtitle-overlay{
      position:absolute;
      left:4%;
      right:4%;
      bottom:8%;
      text-align:center;
      pointer-events:none;
      color:white;
      text-shadow:
        2px 2px 3px #000,
        -2px -2px 3px #000,
        0 0 5px #000;
      font-size:100%;
      line-height:1.35;
      z-index:5;
    }

    .drop-zone{
      margin-top:10px;
      padding:20px;
      border:1px dashed #555;
      border-radius:10px;
      text-align:center;
      background:#0c0c0c;
    }

    .drop-zone.drag{
      border-color:var(--accent);
      background:#071321;
    }

    .url-row{
      display:flex;
      gap:7px;
      margin-top:8px;
    }

    .url-row input{
      flex:1;
      min-width:0;
    }

    input[type="text"],
    input[type="number"],
    select{
      width:100%;
      min-height:42px;
      background:#080808;
      color:#fff;
      border:1px solid #3a3a3a;
      border-radius:7px;
      padding:8px 10px;
      outline:none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus{
      border-color:var(--accent);
    }

    .controls{
      margin-top:10px;
      background:#0d0d0d;
      border:1px solid #292929;
      border-radius:10px;
      padding:10px;
    }

    .control-line{
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .control-line button{
      min-width:42px;
      min-height:40px;
      background:#171717;
      color:#fff;
      border:1px solid #333;
      border-radius:7px;
      padding:6px 10px;
    }

    .control-line button:hover{
      background:#252525;
    }

    .progress-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin:5px 0 10px;
    }

    #progress{
      flex:1;
      min-width:0;
    }

    .time{
      white-space:nowrap;
      font-size:14px;
      color:#ddd;
    }

    input[type="range"]{
      accent-color:#1687ff;
      width:100%;
    }

    .main-settings{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
      margin-top:10px;
    }

    .setting-card{
      background:#111;
      border:1px solid #292929;
      border-radius:9px;
      padding:10px;
    }

    .setting-card label{
      display:block;
      color:#aaa;
      font-size:13px;
      margin-bottom:5px;
    }

    .value-control{
      display:flex;
      align-items:center;
      gap:5px;
    }

    .value-control input,
    .value-control select{
      flex:1;
      min-width:0;
    }

    .small-btn{
      width:40px;
      height:40px;
      flex:0 0 40px;
      background:#181818;
      color:#fff;
      border:1px solid #333;
      border-radius:7px;
      font-size:20px;
    }

    .value{
      min-width:65px;
      text-align:center;
      color:#fff;
      font-weight:bold;
      font-size:14px;
    }

    .section{
      margin-top:10px;
      background:#0d0d0d;
      border:1px solid #292929;
      border-radius:10px;
      padding:10px;
    }

    .section h2{
      margin:0 0 9px;
      font-size:16px;
    }

    .file-row{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .file-row input[type="file"]{
      max-width:100%;
    }

    #queue,
    #history{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:8px;
      border:1px solid #282828;
      border-radius:7px;
      background:#101010;
    }

    .item-title{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .item button{
      background:#191919;
      color:white;
      border:1px solid #333;
      border-radius:6px;
      padding:6px 8px;
    }

    #status{
      margin-top:10px;
      color:#aaa;
      font-size:13px;
      min-height:20px;
    }

    .hidden{
      display:none!important;
    }

    .locked .player-wrap{
      pointer-events:none;
    }

    .info{
      color:#888;
      font-size:12px;
      line-height:1.5;
      margin-top:6px;
    }

    @media(max-width:900px){
      .main-settings{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:600px){
      .app{
        padding:7px;
      }

      header h1{
        font-size:17px;
      }

      .main-settings{
        grid-template-columns:1fr;
      }

      .control-line button{
        min-width:39px;
        min-height:38px;
        padding:5px 8px;
      }

      .player-wrap{
        min-height:190px;
      }

      .url-row{
        flex-direction:column;
      }

      .subtitle-overlay{
        bottom:10%;
      }
    }

    @media(min-width:1400px){
      .app{
        max-width:1700px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <h1>🎬 Universal Player</h1>

    <div class="header-buttons">
      <button class="btn" id="openBtn">📁 Open</button>
      <button class="btn" id="fullscreenBtn">⛶ Fullscreen</button>
    </div>
  </header>

  <div id="playerWrap" class="player-wrap">

    <video
      id="video"
      playsinline
      preload="metadata"
      crossorigin="anonymous">
    </video>

    <div id="ytBox">
      <div id="ytPlayer"></div>
    </div>

    <div id="subtitleOverlay" class="subtitle-overlay"></div>
  </div>

  <div class="drop-zone" id="dropZone">
    📂 Drag & Drop Video / Audio Here
    <br>
    <small>Local file ya direct media URL use karo</small>

    <div class="file-row" style="margin-top:10px">
      <input id="fileInput" type="file"
        accept="video/*,audio/*,.mkv,.avi,.mov,.mp4,.webm,.m4v,.ts,.m2ts,.flv,.wmv,.mp3,.aac,.flac,.wav,.ogg,.opus,.m4a">
    </div>
  </div>

  <div class="url-row">
    <input id="urlInput" type="text"
      placeholder="Direct video/audio URL ya YouTube URL paste karo">
    <button class="btn" id="playUrlBtn">▶ Play URL</button>
  </div>

  <div class="controls">

    <div class="progress-row">
      <span class="time" id="currentTime">00:00</span>
      <input id="progress" type="range" min="0" max="1000" value="0">
      <span class="time" id="duration">00:00</span>
    </div>

    <div class="control-line">

      <button id="prevBtn" title="Previous">⏮</button>
      <button id="backBtn" title="-10 seconds">-10</button>
      <button id="playBtn" title="Play/Pause">▶</button>
      <button id="forwardBtn" title="+10 seconds">+10</button>
      <button id="nextBtn" title="Next">⏭</button>

      <button id="muteBtn" title="Mute">🔊</button>

      <button id="frameBackBtn" title="Previous frame">◀|</button>
      <button id="frameNextBtn" title="Next frame">|▶</button>

      <button id="rotateBtn" title="Rotate">🔄</button>
      <button id="pipBtn" title="Picture in Picture">▣ PiP</button>
      <button id="lockBtn" title="Lock player">🔒</button>
      <button id="stopBtn" title="Stop">⏹</button>

      <button id="settingsBtn">⚙ Settings</button>
    </div>

  </div>

  <div id="settingsPanel" class="main-settings">

    <div class="setting-card">
      <label>Speed</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="speed">−</button>
        <select id="speed"></select>
        <button class="small-btn" data-action="plus" data-target="speed">+</button>
      </div>
    </div>

    <div class="setting-card">
      <label>Volume</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="volume">−</button>
        <span id="volumeValue" class="value">100%</span>
        <button class="small-btn" data-action="plus" data-target="volume">+</button>
      </div>
      <input id="volume" type="range" min="0" max="100" step="1" value="100">
    </div>

    <div class="setting-card">
      <label>Brightness</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="brightness">−</button>
        <span id="brightnessValue" class="value">100%</span>
        <button class="small-btn" data-action="plus" data-target="brightness">+</button>
      </div>
      <input id="brightness" type="range" min="0" max="200" step="1" value="100">
    </div>

    <div class="setting-card">
      <label>Contrast</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="contrast">−</button>
        <span id="contrastValue" class="value">100%</span>
        <button class="small-btn" data-action="plus" data-target="contrast">+</button>
      </div>
      <input id="contrast" type="range" min="0" max="200" step="1" value="100">
    </div>

    <div class="setting-card">
      <label>Saturation</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="saturation">−</button>
        <span id="saturationValue" class="value">100%</span>
        <button class="small-btn" data-action="plus" data-target="saturation">+</button>
      </div>
      <input id="saturation" type="range" min="0" max="200" step="1" value="100">
    </div>

    <div class="setting-card">
      <label>Subtitle Size</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="subtitleSize">−</button>
        <span id="subtitleSizeValue" class="value">100%</span>
        <button class="small-btn" data-action="plus" data-target="subtitleSize">+</button>
      </div>
      <input id="subtitleSize" type="range" min="50" max="200" step="5" value="100">
    </div>

    <div class="setting-card">
      <label>Subtitle Delay</label>
      <div class="value-control">
        <button class="small-btn" data-action="minus" data-target="subtitleDelay">−</button>
        <input id="subtitleDelay" type="number" step="100" value="0">
        <button class="small-btn" data-action="plus" data-target="subtitleDelay">+</button>
      </div>
      <div class="info">milliseconds — + = subtitle late, − = early</div>
    </div>

    <div class="setting-card">
      <label>Aspect Ratio</label>
      <select id="aspect">
        <option value="best">Best Fit</option>
        <option value="fit">Fit Screen</option>
        <option value="fill">Fill / Stretch</option>
        <option value="original">Original</option>
        <option value="16:9">16:9</option>
        <option value="4:3">4:3</option>
        <option value="16:10">16:10</option>
        <option value="2:1">2:1</option>
        <option value="2.21:1">2.21:1</option>
        <option value="2.35:1">2.35:1</option>
        <option value="2.39:1">2.39:1</option>
        <option value="5:4">5:4</option>
        <option value="center">Centre</option>
      </select>
    </div>

    <div class="setting-card">
      <label>Video Quality</label>
      <select id="quality">
        <option value="-1">Auto</option>
      </select>
      <div class="info" id="qualityInfo">
        HLS/source-supported qualities appear here.
      </div>
    </div>

    <div class="setting-card">
      <label>Audio Track</label>
      <select id="audioTrack">
        <option value="-1">Default</option>
      </select>
      <div class="info" id="audioInfo">
        Browser/source supported tracks.
      </div>
    </div>

    <div class="setting-card">
      <label>Subtitle</label>
      <select id="subtitleMode">
        <option value="off">Off</option>
        <option value="on">On</option>
      </select>
    </div>

    <div class="setting-card">
      <label>Subtitle File</label>
      <input id="subtitleFile" type="file" accept=".srt,.vtt,text/vtt,application/x-subrip">
    </div>

    <div class="setting-card">
      <label>Repeat</label>
      <select id="repeat">
        <option value="off">Off</option>
        <option value="one">Repeat One</option>
        <option value="all">Repeat All</option>
      </select>
    </div>

    <div class="setting-card">
      <label>Shuffle</label>
      <select id="shuffle">
        <option value="off">Off</option>
        <option value="on">On</option>
      </select>
    </div>

  </div>

  <div class="section">
    <h2>Playlist / Queue</h2>
    <div id="queue"></div>
  </div>

  <div class="section">
    <h2>History</h2>
    <div id="history"></div>
  </div>

  <div id="status"></div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
