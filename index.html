<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Universal Player</title>

<style>
:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#171717;
  --line:#292929;
  --text:#f4f4f4;
  --muted:#a6a6a6;
  --accent:#ff6a00
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  max-width:1500px;
  margin:auto;
  padding:12px
}

.topbar{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:10px
}

.brand{
  font-weight:800;
  font-size:20px;
  margin-right:auto
}

.topbar button,
.file-btn,
.url-btn,
.tool-btn{
  border:1px solid var(--line);
  background:#171717;
  color:#fff;
  border-radius:9px;
  padding:9px 12px
}

.player-shell{
  position:relative;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  min-height:280px;
  height:min(76vh,820px);
  display:flex;
  align-items:center;
  justify-content:center
}

.player-shell:fullscreen{
  height:100vh;
  border-radius:0
}

video{
  width:100%;
  height:100%;
  background:#000;
  display:block;
  object-fit:contain;
  object-position:center
}

.audio-screen{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at center,#222,#050505 65%)
}

.audio-screen .note{
  font-size:70px
}

.player-shell.audio-only .audio-screen{
  display:flex
}

.player-shell.audio-only video{
  opacity:0
}

.overlay-title{
  position:absolute;
  top:16px;
  left:18px;
  right:18px;
  font-size:18px;
  text-shadow:0 2px 8px #000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  opacity:0;
  transform:translateY(-6px);
  transition:.2s;
  pointer-events:none
}

.controls-visible .overlay-title{
  opacity:1;
  transform:none
}

.controls{
  position:absolute;
  inset:auto 0 0;
  padding:10px 12px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.9) 40%);
  opacity:0;
  transition:.2s
}

.controls-visible .controls{
  opacity:1
}

.progress{
  width:100%;
  accent-color:var(--accent);
  margin:0 0 7px
}

.control-row{
  display:flex;
  align-items:center;
  gap:7px
}

.control-row button,
.control-row select{
  height:38px;
  border:0;
  border-radius:8px;
  background:rgba(25,25,25,.86);
  color:#fff;
  padding:0 10px
}

.control-row .big{
  font-size:20px;
  min-width:44px
}

.time{
  font-size:13px;
  color:#eee;
  white-space:nowrap;
  margin:0 4px
}

.spacer{
  flex:1
}

.popover{
  position:absolute;
  right:10px;
  bottom:64px;
  min-width:230px;
  max-height:70%;
  overflow:auto;
  background:rgba(20,20,20,.97);
  border:1px solid #333;
  border-radius:12px;
  box-shadow:0 10px 35px #000;
  display:none;
  z-index:20;
  padding:7px
}

.popover.open{
  display:block
}

.menu-title{
  font-weight:700;
  color:#aaa;
  padding:9px 12px
}

.menu-item{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:8px
}

.menu-item:hover,
.menu-item.active{
  background:#2b2b2b
}

.menu-item small{
  display:block;
  color:#999;
  margin-top:3px
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-top:10px
}

.dropzone{
  border:1px dashed #666;
  border-radius:10px;
  padding:18px;
  text-align:center;
  color:#ddd
}

.input-row{
  display:flex;
  gap:8px;
  margin-top:9px
}

.input-row input{
  flex:1;
  min-width:0;
  background:#090909;
  border:1px solid #333;
  color:#fff;
  border-radius:8px;
  padding:10px
}

.file-input{
  display:none
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:8px;
  margin-top:10px
}

.card{
  background:#0c0c0c;
  border:1px solid #242424;
  border-radius:10px;
  padding:10px
}

.card label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:5px
}

.card input[type=range],
.card select{
  width:100%
}

.status{
  color:#aaa;
  font-size:13px;
  min-height:18px;
  margin-top:8px
}

.queue{
  max-height:220px;
  overflow:auto
}

.queue-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border-bottom:1px solid #222
}

.queue-item button{
  border:0;
  background:#222;
  color:#fff;
  border-radius:7px;
  padding:6px 8px
}

.queue-item .name{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.badge{
  font-size:11px;
  color:#aaa
}

.hidden{
  display:none!important
}

@media(max-width:700px){

  .app{
    padding:0
  }

  .topbar{
    padding:8px
  }

  .brand{
    font-size:17px
  }

  .player-shell{
    border-radius:0;
    height:58vh;
    min-height:240px
  }

  .panel{
    border-radius:0;
    margin-top:6px
  }

  .controls{
    padding:7px 7px calc(8px + env(safe-area-inset-bottom))
  }

  .control-row{
    gap:4px
  }

  .control-row button,
  .control-row select{
    height:35px;
    padding:0 7px;
    font-size:12px
  }

  .control-row .desktop-only{
    display:none
  }

  .time{
    font-size:11px
  }

  .overlay-title{
    font-size:15px;
    top:10px;
    left:10px
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="brand">Universal Player</div>

    <label class="file-btn">
      Open
      <input
        id="fileInput"
        class="file-input"
        type="file"
        accept="video/*,audio/*,.mkv,.avi,.mov,.flv,.ts,.m2ts,.webm,.mp4,.mp3,.aac,.m4a,.wav,.flac,.ogg,.opus"
      >
    </label>

    <button id="fullscreenBtn">⛶</button>
  </div>

  <section id="playerShell" class="player-shell">

    <video
      id="video"
      playsinline
      preload="metadata"
    ></video>

    <div class="audio-screen">
      <div class="note">♫</div>
    </div>

    <div id="overlayTitle" class="overlay-title"></div>

    <div id="controls" class="controls">

      <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="1000"
        value="0"
      >

      <div class="control-row">

        <button id="prevBtn" class="big">⏮</button>

        <button id="backBtn">↶10</button>

        <button id="playBtn" class="big">▶</button>

        <button id="forwardBtn">10↷</button>

        <button id="nextBtn" class="big">⏭</button>

        <span id="time" class="time">
          00:00 / 00:00
        </span>

        <div class="spacer"></div>

        <button id="audioBtn">🔊</button>

        <button id="subtitleBtn">CC</button>

        <button id="aspectBtn">▣</button>

        <button id="moreBtn">⋮</button>

        <button id="fullscreenBtn2">⛶</button>

      </div>
    </div>

    <div id="audioMenu" class="popover"></div>
    <div id="subtitleMenu" class="popover"></div>
    <div id="aspectMenu" class="popover"></div>
    <div id="moreMenu" class="popover"></div>

  </section>

  <section class="panel">

    <div id="dropzone" class="dropzone">
      📁 Drag & Drop Video / Audio Here
    </div>

    <div class="input-row">

      <input
        id="urlInput"
        type="url"
        placeholder="Paste direct video/audio URL"
      >

      <button id="urlBtn" class="url-btn">
        Play URL
      </button>

    </div>

    <div id="status" class="status"></div>

  </section>

  <section class="panel">

    <div class="grid">

      <div class="card">
        <label>Speed</label>
        <select id="speed"></select>
      </div>

      <div class="card">
        <label>Volume</label>
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step=".01"
          value="1"
        >
      </div>

      <div class="card">
        <label>Subtitle size</label>
        <input
          id="subSize"
          type="range"
          min="70"
          max="180"
          value="100"
        >
      </div>

      <div class="card">
        <label>Subtitle delay (ms)</label>
        <input
          id="subDelay"
          type="number"
          value="0"
          step="100"
        >
      </div>

      <div class="card">
        <label>Brightness</label>
        <input
          id="brightness"
          type="range"
          min="50"
          max="150"
          value="100"
        >
      </div>

      <div class="card">
        <label>Contrast</label>
        <input
          id="contrast"
          type="range"
          min="50"
          max="150"
          value="100"
        >
      </div>

      <div class="card">
        <label>Saturation</label>
        <input
          id="saturation"
          type="range"
          min="0"
          max="200"
          value="100"
        >
      </div>

      <div class="card">
        <label>Hue</label>
        <input
          id="hue"
          type="range"
          min="-180"
          max="180"
          value="0"
        >
      </div>

      <div class="card">
        <label>Repeat</label>
        <select id="repeat">
          <option value="off">Off</option>
          <option value="one">One</option>
          <option value="all">All</option>
        </select>
      </div>

      <div class="card">
        <label>Shuffle</label>
        <button id="shuffleBtn" class="tool-btn">
          Off
        </button>
      </div>

    </div>

  </section>

  <section class="panel">

    <b>Playlist / Queue</b>

    <div id="queue" class="queue"></div>

  </section>

  <section class="panel">

    <b>Media info</b>

    <div id="info" class="status">
      No media loaded.
    </div>

  </section>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
