<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover">

  <meta name="theme-color" content="#000000">

  <title>Universal Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .topbar {
      height: 64px;
      min-height: 64px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #222;
      background: #050505;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .player {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      pointer-events: none;
    }

    .empty-title {
      font-size: clamp(22px, 3vw, 38px);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .empty-text {
      color: #aaa;
      font-size: clamp(14px, 1.5vw, 18px);
    }

    .controls {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #050505;
      border-top: 1px solid #222;
      flex-wrap: wrap;
    }

    button,
    select,
    input {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #1c1c1c;
    }

    .url-box {
      flex: 1;
      min-width: 220px;
    }

    .url-box input {
      width: 100%;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 54px;
        min-height: 54px;
        padding: 0 12px;
      }

      .content {
        padding: 0;
      }

      .player {
        border-radius: 0;
      }

      .controls {
        padding: 10px;
      }
    }

    @media (min-width: 1200px) {
      .content {
        padding: 24px;
      }

      .player {
        border: 1px solid #222;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="logo">Universal Player</div>
  </header>

  <main class="content">

    <section class="player">

      <video
        id="video"
        controls
        playsinline
        preload="metadata">
      </video>

      <div class="empty" id="empty">
        <div class="empty-title">Universal Player</div>
        <div class="empty-text">
          Select a video or enter a video URL
        </div>
      </div>

    </section>

  </main>

  <section class="controls">

    <button id="fileButton">
      Open Video
    </button>

    <input
      id="fileInput"
      type="file"
      accept="video/*,audio/*"
      hidden>

    <div class="url-box">
      <input
        id="urlInput"
        type="url"
        placeholder="Paste direct video URL">
    </div>

    <button id="urlButton">
      Play URL
    </button>

    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>

    <button id="fullscreen">
      Fullscreen
    </button>

  </section>

</div>

<script>
  const video = document.getElementById("video");
  const fileInput = document.getElementById("fileInput");
  const fileButton = document.getElementById("fileButton");
  const urlInput = document.getElementById("urlInput");
  const urlButton = document.getElementById("urlButton");
  const speed = document.getElementById("speed");
  const fullscreen = document.getElementById("fullscreen");
  const empty = document.getElementById("empty");

  fileButton.addEventListener("click", () => {
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];

    if (!file) return;

    const objectURL = URL.createObjectURL(file);

    video.src = objectURL;
    video.load();
    video.play().catch(() => {});

    empty.style.display = "none";
  });

  urlButton.addEventListener("click", () => {
    const url = urlInput.value.trim();

    if (!url) return;

    video.src = url;
    video.load();
    video.play().catch(() => {});

    empty.style.display = "none";
  });

  speed.addEventListener("change", () => {
    video.playbackRate = Number(speed.value);
  });

  fullscreen.addEventListener("click", async () => {

    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await video.requestFullscreen();
      }
    } catch (error) {
      console.log(error);
    }

  });

  video.addEventListener("error", () => {
    console.log("Browser could not play this media.");
  });

  video.addEventListener("loadeddata", () => {
    empty.style.display = "none";
  });
</script>

</body>
</html>
