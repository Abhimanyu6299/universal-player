<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Player</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:#fff;
 font-family:Arial,sans-serif
}
header{
 padding:15px;text-align:center;
 font-size:24px;font-weight:bold;
 background:#080808
}
.container{
 width:100%;max-width:1500px;
 margin:auto;padding:12px
}
.player{
 background:#000;position:relative;
 width:100%;overflow:hidden
}
video{
 width:100%;max-height:76vh;
 display:block;margin:auto;
 background:#000;object-fit:contain;
 transition:transform .2s
}
.panel{
 margin-top:12px;padding:12px;
 background:#111;border-radius:10px
}
button,select,input{
 background:#1b1b1b;color:#fff;
 border:1px solid #444;border-radius:6px;
 padding:9px;margin:3px
}
button{cursor:pointer}
button:hover{background:#303030}
input[type=range]{accent-color:#fff}
.url{
 display:flex;gap:4px
}
.url input{flex:1}
.controls{
 display:flex;align-items:center;
 flex-wrap:wrap;gap:3px
}
#progress{width:100%}
#volume{width:120px}
#status{color:#aaa;margin-top:8px;font-size:14px}
#ffmpegBox{display:none;margin-top:8px}
#ffmpegProgress{width:100%}
.drop{
 border:2px dashed #444;
 border-radius:8px;
 padding:15px;text-align:center;
 margin-bottom:10px;
 color:#aaa
}
.drop.active{
 border-color:#fff;
 color:#fff
}
.playlist{
 margin-top:15px
}
.playlist h2{font-size:20px}
.item{
 display:flex;
 align-items:center;
 gap:8px;
 background:#151515;
 margin:5px 0;
 padding:8px;
 border-radius:7px
}
.item-name{
 flex:1;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}
.item.active{
 outline:1px solid #777
}
.subcontrols{
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:3px;
 margin-top:8px
}
@media(max-width:700px){
 header{font-size:20px}
 .container{padding:6px}
 .panel{padding:7px}
 button,select,input{padding:8px}
 #volume{width:80px}
}
@media(min-width:1200px){
 button,select{font-size:16px;padding:11px 14px}
}
</style>
</head>

<body>

<header>Universal Player</header>

<div class="container">

<div class="player">
<video id="video" playsinline preload="metadata"></video>
</div>

<div class="panel">

<div id="dropZone" class="drop">
📂 Drag & Drop Video / Audio Here
</div>

<input id="fileInput"
 type="file"
 multiple
 accept="video/*,audio/*,.mkv,.avi,.mov,.flv,.wmv,.webm,.mp4,.m4v,.ts,.m2ts,.mts,.3gp,.ogv,.mp3,.wav,.flac,.aac,.m4a,.ogg">

<div class="url">
<input id="urlInput" type="url"
 placeholder="Direct video/audio URL">
<button id="playUrlBtn">Play URL</button>
</div>

<div class="controls">

<button id="prevBtn">⏮</button>
<button id="playBtn">▶</button>
<button id="backBtn">-10s</button>
<button id="forwardBtn">+10s</button>
<button id="nextBtn">⏭</button>

<span id="currentTime">00:00</span>

</div>

<input id="progress" type="range"
 min="0" max="100" value="0">

<div class="controls">

<span id="duration">00:00</span>

<button id="muteBtn">🔊</button>

<input id="volume" type="range"
 min="0" max="1" step=".01" value="1">

<label>Speed</label>
<select id="speed"></select>

<label>Screen</label>
<select id="aspect">
<option value="contain">Fit</option>
<option value="cover">Fill</option>
<option value="fill">Original</option>
</select>

<button id="rotateBtn">🔄 Rotate</button>
<button id="fullscreenBtn">⛶ Fullscreen</button>

</div>

<div class="subcontrols">

<label>Audio</label>
<select id="audioTracks">
<option value="-1">Default</option>
</select>

<label>Subtitle</label>
<select id="subtitleTracks">
<option value="-1">Off</option>
</select>

<input id="subtitleInput"
 type="file"
 accept=".srt,.vtt">

<label>Size</label>
<select id="subtitleSize">
<option value="18px">Small</option>
<option value="24px" selected>Medium</option>
<option value="32px">Large</option>
<option value="42px">XL</option>
</select>

</div>

<div id="status">Ready</div>

<div id="ffmpegBox">
FFmpeg conversion:
<span id="ffmpegText">0%</span>
<progress id="ffmpegProgress"
 value="0" max="100"></progress>
</div>

</div>

<div class="playlist">

<h2>Playlist / Queue</h2>

<div id="playlist"></div>

</div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
