<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Universal Player</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 15px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  background: #050505;
}

.container {
  width: 100%;
  max-width: 1400px;
  margin: auto;
  padding: 15px;
}

.player {
  width: 100%;
  background: #000;
  position: relative;
  overflow: hidden;
}

video {
  width: 100%;
  max-height: 75vh;
  display: block;
  margin: auto;
  background: #000;
  object-fit: contain;
  transition: transform .25s;
}

.panel {
  margin-top: 15px;
  padding: 15px;
  background: #111;
  border-radius: 10px;
}

input,
select,
button {
  background: #1c1c1c;
  color: white;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 10px;
  margin: 4px;
}

button {
  cursor: pointer;
}

button:hover {
  background: #292929;
}

.url-row {
  display: flex;
  gap: 5px;
}

.url-row input {
  flex: 1;
}

.controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

input[type="range"] {
  accent-color: white;
}

#progress {
  width: 100%;
}

#volume {
  width: 120px;
}

#status {
  margin-top: 10px;
  color: #aaa;
  font-size: 14px;
}

#ffmpegProgressBox {
  display: none;
  margin-top: 10px;
}

#ffmpegProgress {
  width: 100%;
}

.history {
  margin-top: 20px;
}

.history h2 {
  font-size: 20px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #151515;
  padding: 8px;
  margin: 5px 0;
  border-radius: 6px;
  word-break: break-all;
}

.history-item span {
  padding-right: 10px;
}

@media (max-width: 700px) {

  header {
    font-size: 20px;
  }

  .container {
    padding: 8px;
  }

  .panel {
    padding: 8px;
  }

  .controls {
    justify-content: center;
  }

  button,
  select,
  input {
    padding: 8px;
  }

  #volume {
    width: 90px;
  }
}

</style>
</head>

<body>

<header>
  Universal Player
</header>

<div class="container">

  <div class="player">
    <video
      id="video"
      playsinline
      preload="metadata"
    ></video>
  </div>

  <div class="panel">

    <input
      id="fileInput"
      type="file"
      accept="video/*,audio/*,.mkv,.avi,.mov,.flv,.wmv,.webm,.mp4,.m4v,.ts,.m2ts,.mts,.3gp,.ogv,.mp3,.wav,.flac,.aac,.m4a,.ogg"
    />

    <div class="url-row">

      <input
        id="urlInput"
        type="url"
        placeholder="Direct video URL"
      />

      <button id="playUrlBtn">
        Play URL
      </button>

    </div>

    <div class="controls">

      <button id="playBtn">
        ▶
      </button>

      <button id="backBtn">
        -10s
      </button>

      <button id="forwardBtn">
        +10s
      </button>

      <span id="currentTime">
        00:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
      />

      <span id="duration">
        00:00
      </span>

    </div>

    <div class="controls">

      <button id="muteBtn">
        🔊
      </button>

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
      />

      <label>
        Speed
      </label>

      <select id="speed"></select>

      <label>
        Screen
      </label>

      <select id="aspect">
        <option value="contain">
          Fit
        </option>

        <option value="cover">
          Fill
        </option>

        <option value="fill">
          Original
        </option>
      </select>

      <button id="rotateBtn">
        🔄 Rotate
      </button>

      <button id="fullscreenBtn">
        ⛶ Fullscreen
      </button>

    </div>

    <div id="status">
      Ready
    </div>

    <div id="ffmpegProgressBox">

      <div>
        FFmpeg conversion:
        <span id="ffmpegProgressText"></span>
      </div>

      <progress
        id="ffmpegProgress"
        value="0"
        max="100"
      ></progress>

    </div>

  </div>

  <div class="history">

    <h2>
      Playback History
    </h2>

    <div id="historyList"></div>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
